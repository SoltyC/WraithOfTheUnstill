<text x="1285" y="170" font-size="12" font-weight="700" text-anchor="start" fill="#8a5c00">Walker: round</text><text x="1285" y="186" font-size="12" font-weight="700" text-anchor="start" fill="#8a5c00">the north end</text>
<text x="1253" y="680" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• one long barrier, readable from</text><text x="1253" y="697" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">  the Walker's back</text><text x="1253" y="714" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• steering into it makes the Walker</text><text x="1253" y="731" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">  balk and shake you off</text><text x="1253" y="748" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• crossing on foot: glide, the bridges,</text><text x="1253" y="765" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">  later Ridge or an ice bridge</text>
</svg>
