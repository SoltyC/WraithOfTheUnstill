<text x="284" y="204" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">sandfalls off the rim</text>
<polyline points="156,450 130,442 110,450 90,440" fill="none" stroke="#2b211a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="38" y="430" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">Shaper stair</text>
<text x="38" y="680" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• the natural north–south route along</text><text x="38" y="697" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">  the escarpment foot</text><text x="38" y="714" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• alcoves and overhangs = shade (G4)</text><text x="38" y="731" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• 3 side galleries, each a site</text><text x="38" y="748" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• map: hatched rims; no compass</text><text x="38" y="765" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">  pointing into side galleries</text>
