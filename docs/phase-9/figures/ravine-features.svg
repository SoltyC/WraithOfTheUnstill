<text x="695" y="400" font-size="12" font-weight="400" text-anchor="start" fill="#b8432f">portal cells (red): each bend</text><text x="695" y="416" font-size="12" font-weight="400" text-anchor="start" fill="#b8432f">culls the next</text>
<rect x="542.0013007930517" y="424" width="44" height="28" fill="#e2a21b" stroke="#2b211a" rx="4"/><text x="534.0013007930517" y="443" font-size="12" font-weight="700" text-anchor="end" fill="#2b211a">Hourglass</text>
<path d="M589.8070411141043,630 l0,18" stroke="#2b211a" stroke-width="2" marker-end="url(#arr)"/><text x="599.8070411141043" y="646" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">opens into the Galleries</text>
<text x="443" y="680" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• a sand-surf run down its floor</text><text x="443" y="697" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">  (walls are collision, floor is sand)</text><text x="443" y="714" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• 250–350 m long, 2–6 m wide</text><text x="443" y="731" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• the Hourglass sits at a widening</text><text x="443" y="748" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• flash-flood lore (and real water</text><text x="443" y="765" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">  in the side slot after the release)</text>
