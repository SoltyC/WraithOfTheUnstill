<text x="860" y="520" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">aqueduct arches follow the north braid</text>
<text x="848" y="680" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• dry: cracked mud, pale bars — fast</text><text x="848" y="697" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">  flat surf lines across the basin</text><text x="848" y="714" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• restored: thin sheets of water at</text><text x="848" y="731" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">  dusk, flowers after (D8)</text><text x="848" y="748" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">• the south steering route for the</text><text x="848" y="765" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">  Walker crosses them</text>
