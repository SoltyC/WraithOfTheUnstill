<text x="24" y="40" font-size="24" font-weight="700" text-anchor="start" fill="#2b211a">Ravines from above — what fills each one, and what it is for</text>
<rect x="20" y="70" width="395" height="760" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="36" y="98" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">The Red Galleries</text><text x="36" y="118" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">canyon</text>
<rect x="425" y="70" width="395" height="760" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="441" y="98" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">The Needle</text><text x="441" y="118" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">slot canyon</text>
<rect x="830" y="70" width="395" height="760" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="846" y="98" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">The Dry Braids</text><text x="846" y="118" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">wadis</text>
