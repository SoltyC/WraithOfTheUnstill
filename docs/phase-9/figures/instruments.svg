<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="860" viewBox="0 0 1640 860" font-family="Georgia, 'Times New Roman', serif">
<defs>
<pattern id="strata" patternUnits="userSpaceOnUse" width="40" height="64">
<rect width="40" height="64" fill="#c8693e"/><rect y="9" width="40" height="7" fill="#e3a774"/><rect y="20" width="40" height="12" fill="#b4532f"/>
<rect y="35" width="40" height="5" fill="#ebc58f"/><rect y="44" width="40" height="9" fill="#d98b55"/><rect y="56" width="40" height="4" fill="#a9472a"/>
</pattern>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#2b211a" stroke-width="1.2" opacity="0.5"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b211a"/></marker>
<marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8432f"/></marker>
<marker id="arrGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2b81b"/></marker>

</defs>
<rect width="1640" height="860" fill="#f6efe0"/>
<text x="24" y="40" font-size="24" font-weight="700" text-anchor="start" fill="#2b211a">The Silent Instruments — the three hub sites, laid out</text>
<text x="24" y="64" font-size="14" font-weight="400" text-anchor="start" fill="#6d5d4e">Each runs teach → combine → twist in 5–10 minutes, needs only Frost, and lights a third of the Walker's glass track.</text>
<rect x="20" y="84" width="530" height="760" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="36" y="112" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">A · The Sun Gate</text><text x="36" y="132" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">a side gallery of the Red Galleries, from above</text>
<path d="M80,194 L490,194 L490,554 L80,554 Z" fill="#ecd29b" stroke="#b4532f" stroke-width="16"/>
<rect x="400" y="180" width="40" height="28" fill="#d9e8ef"/><text x="420" y="174" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">east notch (morning)</text>
<rect x="66" y="424" width="28" height="40" fill="#d9e8ef"/><text x="60" y="479" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">west arch (afternoon)</text>
<polyline points="420,202 420,334 280,334 160,334 160,202" fill="none" stroke="#f2b81b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
<rect x="402" y="329" width="36" height="10" fill="#3fa7bf" stroke="#2b211a" transform="rotate(45 420 334)"/>
<rect x="142" y="329" width="36" height="10" fill="#3fa7bf" stroke="#2b211a" transform="rotate(-45 160 334)"/>
<rect x="246" y="300" width="68" height="68" fill="#3f7fae" opacity="0.35" stroke="#2b211a"/>
<ellipse cx="280" cy="334" rx="8" ry="22" fill="#8fcbe6" stroke="#1f6d8f" stroke-width="2"/>
<circle cx="160" cy="210" r="12" fill="#e2a21b" stroke="#2b211a" stroke-width="2"/>
<path d="M130,202 L190,202" stroke="#d4b273" stroke-width="12" stroke-dasharray="3 4"/>
<rect x="320" y="464" width="70" height="40" fill="#ebc58f" stroke="#2b211a"/><text x="355" y="489" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">door</text>
<polyline points="420,344 380,464" fill="none" stroke="#f2b81b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/>
<circle cx="454" cy="314" r="12" fill="#b8432f" stroke="#fff" stroke-width="2"/><text x="454" y="319" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">1</text><circle cx="280" cy="386" r="12" fill="#b8432f" stroke="#fff" stroke-width="2"/><text x="280" y="391" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">2</text><circle cx="206" cy="216" r="12" fill="#b8432f" stroke="#fff" stroke-width="2"/><text x="206" y="221" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">3</text>
<text x="40" y="604" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">1 TEACH — strike mirror-stone 1 (turns 45°): the</text><text x="40" y="622" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   beam lights a glyph and the ledge door opens.</text><text x="40" y="640" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">2 COMBINE — Crystallize the basin into an ice lens</text><text x="40" y="658" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   to bend the beam; it melts in ~20 s, so turn</text><text x="40" y="676" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   mirror-stone 2 in time.</text><text x="40" y="694" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">3 TWIST — a sandfall veils the gate's eye: freeze</text><text x="40" y="712" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   it, shatter it, ~60 s before it re-forms.</text><text x="40" y="730" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">PAYOFF — the beam leaves the canyon each day at</text><text x="40" y="748" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   that hour and points at the Walker.</text>
<rect x="560" y="84" width="530" height="760" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="576" y="112" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">B · The Hourglass</text><text x="576" y="132" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">in the Needle slot canyon, in section</text>
<polygon points="685,204 785,154 885,204" fill="#ecd29b" stroke="#d4b273" stroke-width="2"/><text x="895" y="176" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">rim dune: pours forever</text>
<path d="M805,204 L805,234" stroke="#d4b273" stroke-width="8" stroke-dasharray="3 3"/>
<path d="M735,244 Q805,294 875,244" fill="#ebc58f" stroke="#2b211a" stroke-width="2"/><text x="885" y="260" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">top bowl</text>
<rect x="797" y="280" width="16" height="12" fill="#2b211a"/><text x="765" y="290" font-size="12" font-weight="400" text-anchor="end" fill="#2b211a">sluice</text>
<polyline points="805,292 835,344" fill="none" stroke="#d4b273" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
<circle cx="823" cy="320" r="7" fill="#8fcbe6" stroke="#1f6d8f" stroke-width="2"/><text x="837" y="320" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">breach: freeze it</text>
<path d="M745,364 Q835,414 925,364" fill="#ebc58f" stroke="#2b211a" stroke-width="2"/><text x="935" y="380" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">middle bowl</text>
<polyline points="785,380 835,386 885,380" fill="none" stroke="#b8432f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3"/><text x="835" y="404" font-size="12" font-weight="700" text-anchor="middle" fill="#b8432f">Sweep a channel → right</text>
<polyline points="775,394 705,504" fill="none" stroke="#d4b273" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" /><polyline points="895,394 965,504" fill="none" stroke="#d4b273" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
<rect x="725" y="434" width="22" height="18" fill="#8fcbe6" stroke="#1f6d8f" stroke-width="2" transform="rotate(-55 736 443)"/>
<text x="675" y="434" font-size="12" font-weight="400" text-anchor="end" fill="#2b211a">freeze the left</text><text x="675" y="450" font-size="12" font-weight="400" text-anchor="end" fill="#2b211a">chute (thaws in sun)</text>
<rect x="665" y="504" width="80" height="50" fill="none" stroke="#2b211a" stroke-width="2"/><text x="705" y="574" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">left cradle</text><text x="705" y="590" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">(pulls door shut)</text>
<rect x="925" y="504" width="80" height="50" fill="#ecd29b" stroke="#2b211a" stroke-width="2"/><text x="965" y="574" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">right cradle</text><text x="965" y="590" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">(lifts the door)</text>
<rect x="805" y="484" width="40" height="90" fill="#b4532f" stroke="#2b211a" stroke-width="2"/><text x="825" y="470" font-size="12" font-weight="700" text-anchor="middle" fill="#2b211a">Needle's Eye</text>
<path d="M855,354 q8,-10 16,0 q8,10 16,0" fill="none" stroke="#b8432f" stroke-width="2"/><text x="845" y="340" font-size="11" font-weight="400" text-anchor="start" fill="#b8432f">Skitter bulge</text>
<circle cx="775" cy="320" r="12" fill="#b8432f" stroke="#fff" stroke-width="2"/><text x="775" y="325" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">1</text><circle cx="755" cy="380" r="12" fill="#b8432f" stroke="#fff" stroke-width="2"/><text x="755" y="385" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">2</text><circle cx="765" cy="484" r="12" fill="#b8432f" stroke="#fff" stroke-width="2"/><text x="765" y="489" font-size="13" font-weight="800" text-anchor="middle" fill="#fff">3</text>
<text x="580" y="624" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">1 TEACH — open the sluice; Crystallize the breach.</text><text x="580" y="642" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">2 COMBINE — Sweep the middle bowl so all the sand</text><text x="580" y="660" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   goes right.</text><text x="580" y="678" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">3 TWIST — the left cradle shuts the door: freeze its</text><text x="580" y="696" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   chute and fill the right one within ~60 s, or wait</text><text x="580" y="714" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   for the canyon's shadow to keep the frost.</text><text x="580" y="732" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">PRESSURE — Skitters spill the bowls; freezing a bowl</text><text x="580" y="750" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   stops them burrowing. Leaving drains it (reset).</text>
<rect x="1100" y="84" width="530" height="760" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="1116" y="112" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">C · The Singing Dunes</text><text x="1116" y="132" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">three star dunes and a resonance ring, from above</text>
<path d="M1230.0,204.0L1251.2,254.9L1306.1,259.3L1264.2,295.1L1277.0,348.7L1230.0,320.0L1183.0,348.7L1195.8,295.1L1153.9,259.3L1208.8,254.9Z" fill="#ecd29b" stroke="#d4b273" stroke-width="2"/><text x="1230" y="384" font-size="13" font-weight="700" text-anchor="middle" fill="#2b211a">LOW (biggest)</text><path d="M1500.0,252.0L1516.4,291.4L1559.0,294.8L1526.5,322.6L1536.4,364.2L1500.0,341.9L1463.6,364.2L1473.5,322.6L1441.0,294.8L1483.6,291.4Z" fill="#8fcbe6" stroke="#d4b273" stroke-width="2"/><text x="1500" y="242" font-size="13" font-weight="700" text-anchor="middle" fill="#2b211a">MIDDLE — freeze first</text><path d="M1350.0,458.0L1362.2,487.3L1393.7,489.8L1369.7,510.4L1377.0,541.2L1350.0,524.7L1323.0,541.2L1330.3,510.4L1306.3,489.8L1337.8,487.3Z" fill="#ecd29b" stroke="#d4b273" stroke-width="2"/><text x="1350" y="570" font-size="13" font-weight="700" text-anchor="middle" fill="#2b211a">HIGH</text>
<rect x="1392" y="366" width="8" height="16" fill="#a9472a" stroke="#2b211a"/>
<rect x="1382.210734848327" y="386.3276185441688" width="8" height="16" fill="#a9472a" stroke="#2b211a"/>
<rect x="1360.214455717136" y="391.3481257167274" width="8" height="16" fill="#a9472a" stroke="#2b211a"/>
<rect x="1342.5748094345372" y="377.2809772170565" width="8" height="16" fill="#a9472a" stroke="#2b211a"/>
<rect x="1342.5748094345372" y="354.7190227829435" width="8" height="16" fill="#a9472a" stroke="#2b211a"/>
<rect x="1360.214455717136" y="340.6518742832726" width="8" height="16" fill="#a9472a" stroke="#2b211a"/>
<rect x="1382.210734848327" y="345.6723814558312" width="8" height="16" fill="#a9472a" stroke="#2b211a"/>
<text x="1370" y="379" font-size="11" font-weight="400" text-anchor="middle" fill="#2b211a">ring</text>
<path d="M1250,334 C1310,524 1260,514 1320,494" fill="none" stroke="#b8432f" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#arrRed)"/>
<path d="M1390,494 C1470,464 1480,434 1500,374" fill="none" stroke="#b8432f" stroke-width="3" stroke-dasharray="9 5" marker-end="url(#arrRed)"/>
<text x="1160" y="464" font-size="12" font-weight="400" text-anchor="start" fill="#b8432f">surf off a crest, ride</text><text x="1160" y="480" font-size="12" font-weight="400" text-anchor="start" fill="#b8432f">the avalanche, carry</text><text x="1160" y="496" font-size="12" font-weight="400" text-anchor="start" fill="#b8432f">speed to the next</text>
<path d="M1520,464 c20,-30 50,10 30,40 c-20,30 -60,0 -30,-40" fill="none" stroke="#6d5d4e" stroke-width="2" stroke-dasharray="4 3"/><text x="1550" y="534" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">Whirler</text><text x="1550" y="550" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">patrol</text>
<rect x="1130" y="574" width="470" height="36" fill="#fff" stroke="#2b211a" rx="4"/><text x="1365" y="598" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">PHRASE:  LOW  →  HIGH  →  MIDDLE   (each boom ~6 s)</text>
<text x="1120" y="644" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">1 TEACH — one dune, one boom, one note of light.</text><text x="1120" y="662" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">2 COMBINE — play the phrase; ~150 m between dunes,</text><text x="1120" y="680" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   so surf it.</text><text x="1120" y="698" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">3 TWIST — the middle dune slides in sympathy with</text><text x="1120" y="716" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   the low one: freeze it, then strike the crust</text><text x="1120" y="734" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   when its turn comes.</text><text x="1120" y="752" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">MASTERY — the whole phrase in one unbroken surf:</text><text x="1120" y="770" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">   the Sand-runner's robe.</text>
</svg>
