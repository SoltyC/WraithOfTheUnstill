<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1080" viewBox="0 0 1640 1080" font-family="Georgia, 'Times New Roman', serif">
<defs>
<pattern id="strata" patternUnits="userSpaceOnUse" width="40" height="64">
<rect width="40" height="64" fill="#c8693e"/><rect y="9" width="40" height="7" fill="#e3a774"/><rect y="20" width="40" height="12" fill="#b4532f"/>
<rect y="35" width="40" height="5" fill="#ebc58f"/><rect y="44" width="40" height="9" fill="#d98b55"/><rect y="56" width="40" height="4" fill="#a9472a"/>
</pattern>
