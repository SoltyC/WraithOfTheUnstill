<text x="920" y="950" font-size="12" font-weight="400" text-anchor="start" fill="#f0e2cc">bedrock under the sandstone</text>
<polyline points="1146,800 1154,814 1148,826" fill="none" stroke="#3fa7bf" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<polyline points="1306,870 1314,884 1308,896" fill="none" stroke="#3fa7bf" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<polyline points="1164,890 1172,904 1166,916" fill="none" stroke="#3fa7bf" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
<text x="1338" y="876" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">glass seams where the Walker's</text><text x="1338" y="892" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">step split the rock (pinpoint glints)</text>
<polygon points="1152,760 1308,774 1304,788 1150,776" fill="#ebc58f" stroke="#2b211a" stroke-width="1.5"/>
<text x="1338" y="770" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">a fallen span (some reach a ledge)</text>
<path d="M1078,692 Q1230,630 1392,696" fill="none" stroke="#b8432f" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrRed)"/>
<text x="1230" y="650" font-size="13" font-weight="700" text-anchor="middle" fill="#b8432f">glide across</text>
<line x1="1138" y1="702" x2="1322" y2="702" stroke="#8fcbe6" stroke-width="6" stroke-dasharray="10 5"/>
<text x="1230" y="722" font-size="12" font-weight="700" text-anchor="middle" fill="#1f6d8f">Ridge or ice bridge, once known</text>
<line x1="890" y1="700" x2="890" y2="976" stroke="#2b211a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="898" y="843" font-size="13" font-weight="700" text-anchor="start" fill="#2b211a">60 m</text>
<line x1="1138" y1="670" x2="1322" y2="670" stroke="#2b211a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="1230" y="662" font-size="13" font-weight="700" text-anchor="middle" fill="#2b211a">40 m (15–40)</text>
<text x="850" y="1046" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a" font-style="italic">No floor on foot: falling in means a long fall to a shrine. The Walker must be steered round either end.</text>
</svg>
