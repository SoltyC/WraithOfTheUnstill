</defs>
<rect width="1640" height="1080" fill="#f6efe0"/>
<text x="24" y="40" font-size="24" font-weight="700" text-anchor="start" fill="#2b211a">Ravines in section — the four types, to scale (except where marked)</text>
<text x="24" y="64" font-size="14" font-weight="400" text-anchor="start" fill="#6d5d4e">Sandstone strata are triplanar bands by height, so they line up across a canyon. Shade on the floor is a puzzle rule (frozen sand lasts there).</text>
<rect x="20" y="84" width="800" height="480" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="36" y="112" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">1 · The Red Galleries — canyon</text><text x="36" y="132" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">walls 30–80 m in steps, floor 40–120 m; 2.4 px = 1 m</text>
<rect x="22" y="140" width="796" height="420" fill="#d9e8ef"/>
<polygon points="22,214 160,214 170,244 195,248 202,284 225,288 232,334 256,338 265,406 580,406 605,366 592,336 620,264 626,278 660,278 672,278 660,234 668,224 818,224 818,562 22,562" fill="url(#strata)" stroke="#2b211a" stroke-width="2"/>
<polygon points="265,406 170,244 160,214 420,406" fill="#5e6f9a" opacity="0.28"/>
<circle cx="90" cy="174" r="14" fill="#f2b81b" stroke="#c98a00" stroke-width="2"/><line x1="108" y1="174" x2="114" y2="174" stroke="#c98a00" stroke-width="2"/><line x1="102.72792206135786" y1="186.72792206135784" x2="106.97056274847714" y2="190.97056274847714" stroke="#c98a00" stroke-width="2"/><line x1="90" y1="192" x2="90" y2="198" stroke="#c98a00" stroke-width="2"/><line x1="77.27207793864214" y1="186.72792206135784" x2="73.02943725152286" y2="190.97056274847714" stroke="#c98a00" stroke-width="2"/><line x1="72" y1="174" x2="66" y2="174" stroke="#c98a00" stroke-width="2"/><line x1="77.27207793864214" y1="161.27207793864216" x2="73.02943725152286" y2="157.02943725152286" stroke="#c98a00" stroke-width="2"/><line x1="90" y1="156" x2="90" y2="150" stroke="#c98a00" stroke-width="2"/><line x1="102.72792206135784" y1="161.27207793864216" x2="106.97056274847714" y2="157.02943725152286" stroke="#c98a00" stroke-width="2"/>
<line x1="104" y1="184" x2="420" y2="406" stroke="#f2b81b" stroke-width="2" stroke-dasharray="6 5"/>
<text x="290" y="396" font-size="12" font-weight="400" text-anchor="start" fill="#2e3a66" font-style="italic">shade: frozen sand lasts here</text>
<polygon points="265,406 580,406 605,366 540,398 265,401" fill="#ecd29b" stroke="#d4b273" stroke-width="1.5"/>
<polygon points="672,224 720,174 818,224" fill="#ecd29b" stroke="#d4b273" stroke-width="1.5"/>
<path d="M670,226 C650,274 638,286 632,362" fill="none" stroke="#d4b273" stroke-width="7" stroke-dasharray="3 4"/>
<text x="680" y="274" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">sandfall from a rim</text><text x="680" y="290" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">dune (streams once</text><text x="680" y="306" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">restored)</text>
<polyline points="170,244 188,244 188,248" fill="none" stroke="#2b211a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<polyline points="202,284 216,284 216,288" fill="none" stroke="#2b211a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
<text x="38" y="364" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">ledges every 8–15 m:</text><text x="38" y="380" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">Shaper stairs, drift</text><text x="38" y="396" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">ramps and frozen</text><text x="38" y="412" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">sandfalls are the</text><text x="38" y="428" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">ways up (walls are</text><text x="38" y="444" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">not climbable)</text>
<line x1="290" y1="214" x2="290" y2="406" stroke="#2b211a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="298" y="315" font-size="13" font-weight="700" text-anchor="start" fill="#2b211a">80 m (30–80)</text>
<line x1="160" y1="214" x2="320" y2="214" stroke="#2b211a" stroke-dasharray="3 4"/>
<line x1="265" y1="432" x2="580" y2="432" stroke="#2b211a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="422.5" y="424" font-size="13" font-weight="700" text-anchor="middle" fill="#2b211a">40–120 m floor of sand (real terrain state)</text>
<path d="M488.824,402 L490,396.8592 L491.176,402 Z" fill="#3a3f55"/><circle cx="490" cy="396.67776" r="1.5" fill="#3a3f55"/><line x1="490" y1="391.952" x2="508" y2="369.952" stroke="#2b211a" stroke-width="1"/><text x="510" y="367.952" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a" font-style="italic">the Wraith, 1.8 m</text>
<text x="490" y="468" font-size="11" font-weight="400" text-anchor="middle" fill="#6d5d4e" font-style="italic">Wraith drawn ×1.4 for visibility</text>
<rect x="830" y="84" width="790" height="480" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="846" y="112" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">2 · The Needle — slot canyon</text><text x="846" y="132" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">2–6 m wide, 20–40 m deep; 8 px = 1 m</text>
<rect x="832" y="140" width="786" height="354" fill="#d9e8ef"/>
<path d="M1120,174 L1140,214 L1126,264 L1154,314 L1134,374 L1156,424 L1138,464 L1144,494 L832,494 L832,174 Z" fill="url(#strata)" stroke="#2b211a" stroke-width="2"/>
<path d="M1194,174 L1190,224 L1204,274 L1180,324 L1198,384 L1178,434 L1190,474 L1176,494 L1390,494 L1390,174 Z" fill="url(#strata)" stroke="#2b211a" stroke-width="2"/>
<polygon points="1130,174 1186,174 1170,494 1148,494" fill="#f2b81b" opacity="0.35"/>
<text x="1230" y="204" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">light shaft at noon (god-ray card,</text><text x="1230" y="220" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">faded by sun angle)</text>
<line x1="1226" y1="208" x2="1170" y2="234" stroke="#2b211a" stroke-width="1"/>
<polygon points="1144,494 1176,494 1176,486 1144,488" fill="#ecd29b" />
<path d="M1157.2,488 L1160,475.76 L1162.8,488 Z" fill="#3a3f55"/><circle cx="1160" cy="475.328" r="1.5" fill="#3a3f55"/>
<text x="1200" y="490" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a" font-style="italic">← the Wraith, 1.8 m (to scale)</text>
<rect x="1116" y="174" width="80" height="320" fill="none" stroke="#b8432f" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1410" y="294" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">RED DASH: the trench</text><text x="1410" y="310" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">the bake cuts (~10 m)</text><text x="1410" y="326" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a"></text><text x="1410" y="342" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">STRATA INSIDE IT:</text><text x="1410" y="358" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">slot-wall mesh kit,</text><text x="1410" y="374" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">curved, undercut,</text><text x="1410" y="390" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">polished; CPU solids</text><text x="1410" y="406" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">give collision.</text><text x="1410" y="422" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a"></text><text x="1410" y="438" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">The floor stays</text><text x="1410" y="454" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">terrain: sand you</text><text x="1410" y="470" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">can surf.</text>
<line x1="950" y1="174" x2="950" y2="494" stroke="#2b211a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="958" y="339" font-size="13" font-weight="700" text-anchor="start" fill="#2b211a">40 m (20–40)</text>
<line x1="1144" y1="518" x2="1176" y2="518" stroke="#2b211a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="1160" y="510" font-size="13" font-weight="700" text-anchor="middle" fill="#2b211a">4 m (2–6)</text>
<rect x="20" y="580" width="800" height="480" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="36" y="608" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">3 · The Dry Braids — wadi</text><text x="36" y="628" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">30–150 m wide, 3–8 m deep; 4.2 px = 1 m across, VERTICAL ×5</text>
<rect x="22" y="636" width="796" height="420" fill="#d9e8ef"/>
<polygon points="22,720 110,720 120,878 160,888 210,882 250,848 290,850 320,888 380,884 420,842 480,844 520,888 580,886 640,828 720,716 818,712 818,1058 22,1058" fill="#d4b273" stroke="#2b211a" stroke-width="2"/>
<polygon points="110,726 120,884 160,894 210,888 250,854 290,856 320,894 380,890 420,848 480,850 520,894 580,892 640,834 720,722 640,928 120,928" fill="#cdb48a" opacity="0.7"/>
<text x="270" y="836" font-size="11" font-weight="400" text-anchor="middle" fill="#2b211a" font-style="italic">gravel bar</text>
<text x="450" y="836" font-size="11" font-weight="400" text-anchor="middle" fill="#2b211a" font-style="italic">gravel bar</text>
<rect x="132" y="876" width="98" height="10" fill="#3f7fae" opacity="0.75" stroke="#3f7fae" stroke-dasharray="5 3"/>
<rect x="310" y="876" width="90" height="10" fill="#3f7fae" opacity="0.75" stroke="#3f7fae" stroke-dasharray="5 3"/>
<rect x="506" y="876" width="94" height="10" fill="#3f7fae" opacity="0.75" stroke="#3f7fae" stroke-dasharray="5 3"/>
<text x="320" y="952" font-size="12" font-weight="400" text-anchor="middle" fill="#3f7fae" font-style="italic">blue: thin braided sheets of water at dusk, once restored (the Flood Garden is fed from these)</text>
<text x="80" y="700" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">cut bank (outer bend)</text>
<text x="670" y="690" font-size="12" font-weight="400" text-anchor="start" fill="#2b211a">gentle inner bank</text>
<line x1="70" y1="720" x2="70" y2="888" stroke="#2b211a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="78" y="809" font-size="13" font-weight="700" text-anchor="start" fill="#2b211a">8 m</text>
<line x1="110" y1="672" x2="720" y2="672" stroke="#2b211a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="415" y="664" font-size="13" font-weight="700" text-anchor="middle" fill="#2b211a">150 m (30–150)</text>
<text x="60" y="1030" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a">Use: fast, flat surf lines across the basin; the aqueduct ruins follow the north braid.</text>
<rect x="830" y="580" width="790" height="480" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="846" y="608" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">4 · The Stride — the rift</text><text x="846" y="628" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">15–40 m wide, ~60 m deep, sheer; 4.6 px = 1 m</text>
<rect x="832" y="636" width="786" height="64" fill="#d9e8ef"/>
<rect x="832" y="700" width="786" height="358" fill="#1d1512"/>
