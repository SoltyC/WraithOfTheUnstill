<rect width="1640" height="760" fill="#f6efe0"/>
<text x="24" y="40" font-size="24" font-weight="700" text-anchor="start" fill="#2b211a">Quest shape — the frost (built) against the dunes (planned)</text>
<rect x="20" y="60" width="460" height="680" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="36" y="88" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">Frost — one line</text><text x="36" y="108" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">verbs: go · fight · talk · climb · race · carry</text>
<rect x="110" y="130" width="280" height="54" rx="8" fill="#fff" stroke="#2b211a" stroke-width="2"/><text x="250" y="153" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">The Empty Robe</text><text x="250" y="172" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">talk · gestures · race</text>
<rect x="110" y="230" width="280" height="54" rx="8" fill="#fff" stroke="#2b211a" stroke-width="2"/><text x="250" y="253" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">The Pilgrims' Fire</text><text x="250" y="272" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">go · FIGHT · talk</text>
