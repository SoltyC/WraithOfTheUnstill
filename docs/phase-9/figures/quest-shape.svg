<rect x="880" y="260" width="240" height="54" rx="8" fill="#fff4d6" stroke="#e2a21b" stroke-width="2"/><text x="1000" y="283" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">B · Hourglass</text><text x="1000" y="302" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">sand flow G1 G2 G3</text>
<line x1="1270" y1="186" x2="1000" y2="258" stroke="#2b211a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1170" y="260" width="240" height="54" rx="8" fill="#fff4d6" stroke="#e2a21b" stroke-width="2"/><text x="1290" y="283" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">C · Singing Dunes</text><text x="1290" y="302" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">sound G7 G1 G3</text>
<line x1="1270" y1="186" x2="1290" y2="258" stroke="#2b211a" stroke-width="2" marker-end="url(#arr)"/>
<text x="1290" y="360" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a" font-style="italic">any order · each lights a third</text><text x="1290" y="378" font-size="13" font-weight="400" text-anchor="start" fill="#2b211a" font-style="italic">of the glass track · Frost only</text>
<rect x="880" y="380" width="240" height="54" rx="8" fill="#e6eef5" stroke="#2b211a" stroke-width="2"/><text x="1000" y="403" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">Follow the Glass</text><text x="1000" y="422" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">the Long Walker (§5.1)</text>
<line x1="710" y1="316" x2="1000" y2="378" stroke="#2b211a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="1000" y1="316" x2="1000" y2="378" stroke="#2b211a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="1290" y1="316" x2="1000" y2="378" stroke="#2b211a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="880" y="480" width="240" height="54" rx="8" fill="#e6eef5" stroke="#2b211a" stroke-width="2"/><text x="1000" y="503" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">The Well Rises</text><text x="1000" y="522" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">light the well (G6 on its back)</text>
<line x1="1000" y1="436" x2="1000" y2="478" stroke="#2b211a" stroke-width="2" marker-end="url(#arr)"/>
<text x="1000" y="556" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a" font-style="italic">release: the wadis run at dusk</text>
<rect x="560" y="600" width="180" height="54" rx="8" fill="#fbeeee" stroke="#b8432f" stroke-width="2"/><text x="650" y="623" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">1 Mirage Map</text><text x="650" y="642" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">reading · Frost</text>
<rect x="760" y="600" width="180" height="54" rx="8" fill="#fbeeee" stroke="#b8432f" stroke-width="2"/><text x="850" y="623" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">2 Frozen Falls</text><text x="850" y="642" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">G3 G4 · Frost</text>
<rect x="960" y="600" width="180" height="54" rx="8" fill="#fbeeee" stroke="#b8432f" stroke-width="2"/><text x="1050" y="623" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">3 Glass Battle</text><text x="1050" y="642" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">re-enact · + Stone</text>
<rect x="1160" y="600" width="180" height="54" rx="8" fill="#fbeeee" stroke="#b8432f" stroke-width="2"/><text x="1250" y="623" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">4 Buried Door</text><text x="1250" y="642" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">G1 G8 · Stone</text>
<rect x="1360" y="600" width="180" height="54" rx="8" fill="#fbeeee" stroke="#b8432f" stroke-width="2"/><text x="1450" y="623" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">5 Flood Garden</text><text x="1450" y="642" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">water · after release</text>
<text x="1060" y="690" font-size="13" font-weight="400" text-anchor="middle" fill="#b8432f">side sites open from Wellhouse; 3 and 4 need Stone (lent at the waking), 5 needs the release</text>
<text x="1060" y="712" font-size="13" font-weight="400" text-anchor="middle" fill="#6d5d4e" font-style="italic">fights: none as a goal — Skitters and a Whirler press inside B and C</text>
