<line x1="250" y1="284" x2="250" y2="328" stroke="#2b211a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="110" y="430" width="280" height="54" rx="8" fill="#e6eef5" stroke="#2b211a" stroke-width="2"/><text x="250" y="453" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">The Held Snow</text><text x="250" y="472" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">Warden</text>
<line x1="250" y1="384" x2="250" y2="428" stroke="#2b211a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="110" y="530" width="280" height="54" rx="8" fill="#fff" stroke="#2b211a" stroke-width="2"/><text x="250" y="553" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">First Snow</text><text x="250" y="572" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">go · talk · ring</text>
<line x1="250" y1="484" x2="250" y2="528" stroke="#2b211a" stroke-width="2" marker-end="url(#arr)"/>
<text x="250" y="650" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">sides: follow tracks + escort · find a den + fight ·</text><text x="250" y="668" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">find 6 stones · carry a flame · a timed race</text>
<rect x="500" y="60" width="1120" height="680" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/><text x="516" y="88" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">Dunes — a hub of puzzles</text><text x="516" y="108" font-size="13" font-weight="400" text-anchor="start" fill="#6d5d4e" font-style="italic">verbs: read · freeze · cut · trigger · bend light · sing · steer</text>
<rect x="560" y="130" width="240" height="54" rx="8" fill="#fff" stroke="#2b211a" stroke-width="2"/><text x="680" y="153" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">Into the Erg</text><text x="680" y="172" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">Dry Stair (G1) or cold erg (G3)</text>
<rect x="840" y="130" width="240" height="54" rx="8" fill="#fff" stroke="#2b211a" stroke-width="2"/><text x="960" y="153" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">Wellhouse</text><text x="960" y="172" font-size="12" font-weight="400" text-anchor="middle" fill="#6d5d4e">free the sled (G2)</text>
