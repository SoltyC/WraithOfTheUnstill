<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" font-family="Georgia, 'Times New Roman', serif">
<defs>
<pattern id="strata" patternUnits="userSpaceOnUse" width="40" height="64">
<rect width="40" height="64" fill="#c8693e"/><rect y="9" width="40" height="7" fill="#e3a774"/><rect y="20" width="40" height="12" fill="#b4532f"/>
<rect y="35" width="40" height="5" fill="#ebc58f"/><rect y="44" width="40" height="9" fill="#d98b55"/><rect y="56" width="40" height="4" fill="#a9472a"/>
</pattern>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#2b211a" stroke-width="1.2" opacity="0.5"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b211a"/></marker>
<marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8432f"/></marker>
<marker id="arrGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2b81b"/></marker>

</defs>
<rect width="1500" height="980" fill="#f6efe0"/>
<text x="24" y="40" font-size="24" font-weight="700" text-anchor="start" fill="#2b211a">The sand grammar — every dune puzzle is built from these nine rules</text>
<text x="24" y="64" font-size="14" font-weight="400" text-anchor="start" fill="#6d5d4e">G1–G7 need only Frost, so the hub can be solved before the meadow. G8 (Stone) comes with the Walker; G9 (Gale) is always optional.</text>
<rect x="24" y="84" width="476" height="282" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/>
<text x="40" y="114" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">G1 Sand flows</text>
<polygon points="144,244 224,164 264,164 384,244" fill="#ecd29b" stroke="#d4b273" stroke-width="2"/><path d="M269,174 L334,229" stroke="#b8432f" stroke-width="3" marker-end="url(#arrRed)"/><text x="284" y="194" font-size="13" font-weight="700" text-anchor="start" fill="#2b211a">34°</text>
<text x="40" y="298" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">A face steeper than 34° slides</text><text x="40" y="316" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">when disturbed; sand fills the</text><text x="40" y="334" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">lowest place first.</text>
<rect x="516" y="84" width="476" height="282" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/>
<text x="532" y="114" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">G2 Sand takes the channel</text>
<rect x="636" y="164" width="240" height="80" fill="#ecd29b"/><polyline points="656,174 746,204 856,234" fill="none" stroke="#d4b273" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" /><path d="M666,178 L836,230" stroke="#b8432f" stroke-width="3" marker-end="url(#arrRed)"/>
<text x="532" y="298" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">Sweep ploughs a channel;</text><text x="532" y="316" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">flowing sand goes where</text><text x="532" y="334" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">it is cut.</text>
<rect x="1008" y="84" width="476" height="282" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/>
<text x="1024" y="114" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">G3 Frost holds sand</text>
<rect x="1168" y="164" width="22" height="80" fill="#8fcbe6" stroke="#1f6d8f" stroke-width="2"/><path d="M1278,164 L1278,244" stroke="#d4b273" stroke-width="12" stroke-dasharray="3 4"/><text x="1179" y="262" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">frozen</text><text x="1278" y="262" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">running</text><path d="M1198.1,244 L1203,222.58 L1207.9,244 Z" fill="#3a3f55"/><circle cx="1203" cy="221.824" r="2.52" fill="#3a3f55"/>
<text x="1024" y="298" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">Frozen sand does not flow,</text><text x="1024" y="316" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">bears weight, stands upright.</text><text x="1024" y="334" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">A frozen sandfall is a pillar.</text>
<rect x="24" y="380" width="476" height="282" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/>
<text x="40" y="410" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">G4 Sun thaws, shade keeps</text>
<rect x="144" y="460" width="120" height="80" fill="#fff4cf"/><rect x="264" y="460" width="120" height="80" fill="#5e6f9a" opacity="0.35"/><circle cx="174" cy="480" r="10" fill="#f2b81b" stroke="#c98a00" stroke-width="2"/><line x1="188" y1="480" x2="194" y2="480" stroke="#c98a00" stroke-width="2"/><line x1="183.89949493661166" y1="489.8994949366117" x2="188.14213562373095" y2="494.14213562373095" stroke="#c98a00" stroke-width="2"/><line x1="174" y1="494" x2="174" y2="500" stroke="#c98a00" stroke-width="2"/><line x1="164.10050506338834" y1="489.8994949366117" x2="159.85786437626905" y2="494.14213562373095" stroke="#c98a00" stroke-width="2"/><line x1="160" y1="480" x2="154" y2="480" stroke="#c98a00" stroke-width="2"/><line x1="164.10050506338834" y1="470.1005050633883" x2="159.85786437626905" y2="465.85786437626905" stroke="#c98a00" stroke-width="2"/><line x1="174" y1="466" x2="174" y2="460" stroke="#c98a00" stroke-width="2"/><line x1="183.89949493661166" y1="470.1005050633883" x2="188.14213562373095" y2="465.85786437626905" stroke="#c98a00" stroke-width="2"/><text x="204" y="530" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">60 s</text><text x="324" y="530" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">lasts</text><rect x="194" y="490" width="20" height="20" fill="#8fcbe6" opacity="0.5"/><rect x="314" y="490" width="20" height="20" fill="#8fcbe6"/>
<text x="40" y="594" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">Frozen sand thaws in ~60 s in</text><text x="40" y="612" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">sun and lasts in shade.</text><text x="40" y="630" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">Read the shadows.</text>
<rect x="516" y="380" width="476" height="282" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/>
<text x="532" y="410" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">G5 Wet sand stands</text>
<polygon points="656,540 716,460 756,540" fill="#b89257" stroke="#3f7fae" stroke-width="3"/><text x="736" y="490" font-size="13" font-weight="700" text-anchor="start" fill="#2b211a">60°</text><polygon points="776,540 826,506 876,540" fill="#ecd29b" stroke="#d4b273" stroke-width="2"/><text x="826" y="558" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">dry: 34°</text>
<text x="532" y="594" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">Ribbon wets sand: it holds a</text><text x="532" y="612" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">60° face and surfs fast,</text><text x="532" y="630" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">until it dries.</text>
<rect x="1008" y="380" width="476" height="282" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/>
<text x="1024" y="410" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">G6 Light travels</text>
<circle cx="1146" cy="470" r="9" fill="#f2b81b" stroke="#c98a00" stroke-width="2"/><line x1="1159" y1="470" x2="1165" y2="470" stroke="#c98a00" stroke-width="2"/><line x1="1155.192388155425" y1="479.19238815542514" x2="1159.4350288425444" y2="483.4350288425444" stroke="#c98a00" stroke-width="2"/><line x1="1146" y1="483" x2="1146" y2="489" stroke="#c98a00" stroke-width="2"/><line x1="1136.807611844575" y1="479.19238815542514" x2="1132.5649711574556" y2="483.4350288425444" stroke="#c98a00" stroke-width="2"/><line x1="1133" y1="470" x2="1127" y2="470" stroke="#c98a00" stroke-width="2"/><line x1="1136.807611844575" y1="460.80761184457486" x2="1132.5649711574556" y2="456.5649711574556" stroke="#c98a00" stroke-width="2"/><line x1="1146" y1="457" x2="1146" y2="451" stroke="#c98a00" stroke-width="2"/><line x1="1155.192388155425" y1="460.80761184457486" x2="1159.4350288425444" y2="456.5649711574556" stroke="#c98a00" stroke-width="2"/><polyline points="1158,476 1238,526 1288,490 1353,490" fill="none" stroke="#f2b81b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><rect x="1226" y="526" width="26" height="6" fill="#3fa7bf" transform="rotate(-20 1238 529)"/><ellipse cx="1288" cy="490" rx="7" ry="16" fill="#8fcbe6" stroke="#1f6d8f"/><circle cx="1360" cy="490" r="9" fill="#e2a21b" stroke="#2b211a"/>
<text x="1024" y="594" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">Beams reflect off mirror-stones</text><text x="1024" y="612" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">and glass, light glyphs; ice</text><text x="1024" y="630" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">bends a beam, the beam melts it.</text>
<rect x="24" y="676" width="476" height="282" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/>
<text x="40" y="706" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">G7 Sand sings</text>
<polygon points="164,836 194,746 224,836" fill="#ecd29b" stroke="#d4b273" stroke-width="2"/><text x="194" y="854" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">low</text><polygon points="244,836 274,776 304,836" fill="#8fcbe6" stroke="#d4b273" stroke-width="2"/><text x="274" y="854" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">frozen: silent</text><polygon points="319,836 349,796 379,836" fill="#ecd29b" stroke="#d4b273" stroke-width="2"/><text x="349" y="854" font-size="12" font-weight="400" text-anchor="middle" fill="#2b211a">high</text><path d="M204,756 q8,-8 16,0 M200,748 q12,-12 24,0" stroke="#2b211a" fill="none" stroke-width="2"/>
<text x="40" y="890" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">A big face booms as it slides;</text><text x="40" y="908" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">bigger dunes sing lower.</text><text x="40" y="926" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">A frozen face is silent.</text>
<rect x="516" y="676" width="476" height="282" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/>
<text x="532" y="706" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">G8 Stone moves ground</text>
<rect x="636" y="816" width="240" height="20" fill="#ecd29b"/><polygon points="676,816 706,766 806,766 836,816" fill="#d4b273" stroke="#2b211a" stroke-width="2"/><text x="756" y="798" font-size="14" font-weight="700" text-anchor="middle" fill="#2b211a">Ridge</text>
<text x="532" y="890" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">Ridge raises walls and dams,</text><text x="532" y="908" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">Shard strikes from range,</text><text x="532" y="926" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">Bloom digs pits. (Walker)</text>
<rect x="1008" y="676" width="476" height="282" fill="#fffaf0" stroke="#2b211a" stroke-width="1.5" rx="6"/>
<text x="1024" y="706" font-size="19" font-weight="700" text-anchor="start" fill="#2b211a">G9 Wind strips (optional)</text>
<path d="M1148,766 q40,-14 80,0 t80,0" fill="none" stroke="#6d5d4e" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M1148,790 q40,-14 80,0 t80,0" fill="none" stroke="#6d5d4e" stroke-width="2.5" stroke-dasharray="0"/><path d="M1148,814 q40,-14 80,0 t80,0" fill="none" stroke="#6d5d4e" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="1024" y="890" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">Gust strips sand and sets off</text><text x="1024" y="908" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">faces from range; Vortex</text><text x="1024" y="926" font-size="14" font-weight="400" text-anchor="start" fill="#2b211a">digs pits. Never required.</text>
</svg>
